<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Agent</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --ink: #1c1a17; --muted: #6b6560;
    --line: #e6e1da; --accent: #b8562f; --ok: #2f7a4f; --warn: #b8862f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --panel: #201e1b; --ink: #f0ece6; --muted: #9c948a;
      --line: #322e29; --accent: #e07b4f; --ok: #56b07a; --warn: #d6a944;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .label { font-weight: 600; font-size: 16px; }
  .pill {
    font-size: 12px; padding: 2px 9px; border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--line); color: var(--muted);
  }
  .pill.hot { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .pill.ok { border-color: var(--ok); color: var(--ok); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .log {
    margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px;
    font-size: 13px; max-height: 260px; overflow-y: auto;
  }
  .line { display: flex; gap: 8px; padding: 2px 0; }
  .who { color: var(--muted); min-width: 56px; font-variant: small-caps; }
  .them { color: var(--ink); }
  .agent { color: var(--accent); }
  .system { color: var(--muted); font-style: italic; }
  .empty { color: var(--muted); padding: 28px 0; text-align: center; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
       color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Phone Agent</h1>
  <div class="sub" id="status">connecting&hellip;</div>
  <div id="live"></div>
  <h2>Recent</h2>
  <div id="recent"></div>
</div>
<script>
const HOT = new Set(["human_detected", "bridging"]);
const OK = new Set(["bridged", "completed"]);

function fmt(seconds) {
  const s = Math.max(0, Math.round(seconds || 0));
  const m = Math.floor(s / 60);
  return m ? `${m}m ${String(s % 60).padStart(2, "0")}s` : `${s}s`;
}

function card(call, withLog) {
  const el = document.createElement("div");
  el.className = "card";
  const pill = HOT.has(call.phase) ? "pill hot" : OK.has(call.phase) ? "pill ok" : "pill";
  const held = call.hold_seconds ? ` · held ${fmt(call.hold_seconds)}` : "";
  el.innerHTML = `
    <div class="row">
      <span class="label"></span>
      <span class="${pill}"></span>
    </div>
    <div class="meta"></div>`;
  el.querySelector(".label").textContent = call.label || call.to || call.id;
  el.querySelector(".pill").textContent = call.phase.replace(/_/g, " ");
  el.querySelector(".meta").textContent =
    `${call.to || ""} · ${call.mode || ""} · ${fmt(call.elapsed_seconds)}${held}`;

  if (withLog && call.transcript && call.transcript.length) {
    const log = document.createElement("div");
    log.className = "log";
    for (const entry of call.transcript.slice(-40)) {
      const line = document.createElement("div");
      line.className = "line";
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = entry.speaker;
      const text = document.createElement("span");
      text.className = entry.speaker;
      text.textContent = entry.text;
      line.append(who, text);
      log.append(line);
    }
    el.append(log);
    requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
  }
  return el;
}

async function tick() {
  try {
    const data = await (await fetch("/calls")).json();
    const live = document.getElementById("live");
    const recent = document.getElementById("recent");
    live.replaceChildren();
    recent.replaceChildren();

    if (!data.live.length) {
      const none = document.createElement("div");
      none.className = "empty";
      none.textContent = "No calls in progress.";
      live.append(none);
    } else {
      data.live.forEach(c => live.append(card(c, true)));
    }
    data.recent.slice(0, 8).forEach(c => recent.append(card(c, false)));

    const health = await (await fetch("/healthz")).json();
    document.getElementById("status").textContent =
      `speech-to-text: ${health.asr} · menu navigation: ${health.brain ? "on" : "off"} · ${health.live_calls} active`;
  } catch (err) {
    document.getElementById("status").textContent = "server unreachable";
  }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
